name: IXRay AI Package Verification
on:
  push:
    branches: [feature/level-editor-ai]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: pwsh
env:
  NATIVE_COMMIT: a8fbcc4725a4474fd4684d81aca0985d3fd4bacf
  NATIVE_RUN_ID: '42941939771'
jobs:
  package:
    if: contains(github.event.head_commit.message, '[package-only]') && !contains(github.event.head_commit.message, '[inspect-package]') && !contains(github.event.head_commit.message, '[rollback-probe]')
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify unchanged SDK source
        run: |
          git fetch origin $env:NATIVE_COMMIT --depth=1
          if ($LASTEXITCODE) { throw 'Unable to read the source revision of the native artifact.' }
          git diff --exit-code $env:NATIVE_COMMIT HEAD -- src cmake sdk CMakeLists.txt CMakePresets.json CMakeSettings.json NuGet.config gamedata rawdata fs.ltx fsfactory.ltx fsgame.ltx
          if ($LASTEXITCODE) { throw 'SDK source differs from the built revision; a full native rebuild is required.' }
      - name: Download coherent native Release binaries
        uses: actions/download-artifact@v4
        with:
          name: ixray-ai-build-evidence-${{ env.NATIVE_COMMIT }}
          run-id: ${{ env.NATIVE_RUN_ID }}
          github-token: ${{ github.token }}
          path: build/reused-native
      - name: Restore test assets
        run: Copy-Item tools/ai-assistant/fixtures/content/* ./ -Recurse -Force
      - uses: actions/cache@v4
        with:
          path: build/ai-release/downloads
          key: ixray-ai-runtime-${{ hashFiles('tools/ai-assistant/runtime-lock.json') }}
      - name: Package and test official runtimes
        run: |
          $Editors = @(Get-ChildItem build/reused-native -Recurse -File -Filter 'LevelEditor.exe')
          if ($Editors.Count -ne 1) { throw 'The artifact must contain exactly one complete editor binary set.' }
          try {
            ./tools/ai-assistant/package.ps1 -BinaryDirectory $Editors[0].DirectoryName -NativeCommit $env:NATIVE_COMMIT
          } catch {
            Write-Host $_.ScriptStackTrace
            Write-Host $_.InvocationInfo.PositionMessage
            throw
          }
      - name: Verify installed editor, scene operations and rollback
        run: ./tools/ai-assistant/verify-package.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IXRay-AI-Setup-${{ github.sha }}
          path: build/ai-release/*Setup.exe
          if-no-files-found: warn
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IXRay-AI-Portable-${{ github.sha }}
          path: build/ai-release/*Portable.zip
          if-no-files-found: warn
      - name: Upload test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IXRay-AI-Evidence-${{ github.sha }}
          path: |
            build/ai-release/IXRay-AI-Assistant/build-info.json
            build/ai-release/IXRay-AI-Assistant/SHA256SUMS.json
            build/ai-release/CI_EVIDENCE.json
            build/ai-release/ai-selftest-report.json
            build/ai-release/installed-test-evidence/**
          if-no-files-found: warn
