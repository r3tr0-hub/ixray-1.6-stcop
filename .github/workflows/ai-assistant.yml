name: IXRay AI Assistant
on:
  push:
    branches: [feature/level-editor-ai]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ixray-ai-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: pwsh
jobs:
  windows:
    if: "!contains(github.event.head_commit.message, '[package-only]')"
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            build/ai-release/downloads
          key: ixray-ai-deps-${{ hashFiles('**/Packages.config', 'tools/ai-assistant/runtime-lock.json') }}
      - name: Install fixed SDK asset fixtures
        run: |
          if (Test-Path tools/ai-assistant/fixtures/content) { Copy-Item tools/ai-assistant/fixtures/content/* ./ -Recurse -Force }
      - name: Build Windows x64 Release
        run: ./tools/ai-assistant/build.ps1
      - name: Package and test official Codex runtime
        run: ./tools/ai-assistant/package.ps1
      - name: Verify installed editor and update rollback
        run: ./tools/ai-assistant/verify-package.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: IXRay-AI-Setup-${{ github.sha }}
          path: build/ai-release/*Setup.exe
          if-no-files-found: error
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: IXRay-AI-Portable-${{ github.sha }}
          path: build/ai-release/*Portable.zip
          if-no-files-found: error
      - name: Upload test evidence
        uses: actions/upload-artifact@v4
        with:
          name: IXRay-AI-Evidence-${{ github.sha }}
          path: |
            build/ai-release/IXRay-AI-Assistant/build-info.json
            build/ai-release/IXRay-AI-Assistant/SHA256SUMS.json
            build/ai-release/CI_EVIDENCE.json
            build/ai-release/ai-selftest-report.json
          if-no-files-found: error
      - name: Upload native binaries and build evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ixray-ai-build-evidence-${{ github.sha }}
          path: |
            build/x64/Editors-Windows/bin/Release/*.exe
            build/x64/Editors-Windows/bin/Release/*.dll
            build/x64/Editors-Windows/CMakeFiles/CMakeConfigureLog.yaml
            build/ai-release/CI_EVIDENCE.json
            build/ai-release/ai-selftest-report.json
            build/ai-release/installed-test-evidence/**
