name: IXRay AI Assistant
on:
  push:
    branches: [feature/level-editor-ai]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ixray-ai-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ixray-ai-nuget-${{ hashFiles('**/Packages.config') }}
      - name: Configure Windows x64
        run: cmake --preset Editors-x64-Windows -DIXRAY_CI=ON -DIXRAY_PROFILER=OFF
      - name: Build Release
        run: cmake --build build/x64/Editors-Windows --config Release --target LevelEditor --parallel 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ixray-ai-windows-release-${{ github.sha }}
          path: |
            build/x64/Editors-Windows/bin/Release/*.exe
            build/x64/Editors-Windows/bin/Release/*.dll
            build/x64/Editors-Windows/CMakeFiles/CMakeConfigureLog.yaml
